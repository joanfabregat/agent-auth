[package]
name = "agent-auth"
version = "0.1.0-beta.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/joanfabregat/agent-auth"
description = "Private OAuth callbacks for agent-operated cloud CLIs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

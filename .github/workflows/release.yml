name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version and main ancestry
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$revision" origin/main
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$EVENT_NAME" == release ]]; then
            [[ "$TAG" == "v$version" ]]
            [[ "$(git rev-parse "$TAG^{commit}")" == "$revision" ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          printf 'revision=%s\nversion=%s\n' "$revision" "$version" >> "$GITHUB_OUTPUT"

  audit:
    name: Release dependency policy
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ env.RUST_VERSION }}
          command: check

  build:
    name: Build (${{ matrix.arch }})
    needs: [verify, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - name: Install build toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Test and build static binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +"$RUST_VERSION" test --locked --all-targets
          cargo +"$RUST_VERSION" build --release --locked --target "$TARGET"
          "target/$TARGET/release/agent-auth" --version
          if readelf -l "target/$TARGET/release/agent-auth" | grep -q INTERP; then
            echo 'Release binary must be statically linked' >&2
            exit 1
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="agent-auth-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/agent-auth" README.md LICENSE SECURITY.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS
